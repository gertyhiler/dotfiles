# ~/.config/tmux/tmux.conf

# Tokyo Night (hex) — Nerd Font + Powerline symbols for the pill/rounded look.
# Terminal font: use a Nerd Font (e.g. "JetBrainsMono Nerd Font") for icons/.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",wezterm*:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",kitty*:RGB"
set -as terminal-features ",iTerm2:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 200000
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g allow-rename off
set -g automatic-rename off

set -g set-titles on
set -g set-titles-string "#{session_name}  #{pane_current_command}  #{pane_current_path}"

setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind A command-prompt -p "pane title:" "select-pane -T '%%'"
bind B break-pane
bind @ choose-window 'join-pane -h -s "%%"'

set -g pane-border-status top
set -g pane-border-format " #{?pane_active,● ,○ }#{pane_title} "
set -g pane-border-lines heavy

# Tokyo Night — https://github.com/folke/tokyo-night.nvim palette
# bg #1a1b26, fg #c0caf5, green #9ece6a, orange #ff9e64, blue #7aa2f7, purple #bb9af7, red #f7768e
%hidden TN_BG=#1a1b26
%hidden TN_FG=#c0caf5
%hidden TN_GREEN=#9ece6a
%hidden TN_ORANGE=#ff9e64
%hidden TN_BLUE=#7aa2f7
%hidden TN_PURPLE=#bb9af7
%hidden TN_DARK2=#1f2335
%hidden TN_DARK3=#2c3047

# Session: FA terminal  + #S. Window: FA search  + (zoom hint) + #I.  Requires Nerd Font in terminal.
# Powerline:   
%hidden TN_LEFT="#[fg=$TN_GREEN,bg=$TN_BG]#[fg=$TN_BG,bg=$TN_GREEN]  #[fg=$TN_BG,bg=$TN_GREEN]#[fg=$TN_FG,bg=$TN_BG] #S #[fg=$TN_DARK2,bg=$TN_BG] #[fg=$TN_ORANGE,bg=$TN_BG]#[fg=$TN_BG,bg=$TN_ORANGE]  #[fg=$TN_BG,bg=$TN_ORANGE]#[fg=$TN_FG,bg=$TN_BG]#{?window_zoomed_flag, ,}#I #[fg=$TN_DARK2,bg=$TN_BG]"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=$TN_BG,fg=$TN_FG"
set -g status-left-length 90
set -g status-right-length 90
set -g status-left "$TN_LEFT"
# `#{user}` needs tmux 3.2+; otherwise use e.g. `#(id -un)` in place of it.
set -g status-right "#[fg=$TN_PURPLE,bg=$TN_BG]#[fg=$TN_BG,bg=$TN_PURPLE]  #[fg=$TN_BG,bg=$TN_PURPLE]#[fg=$TN_FG,bg=$TN_BG] #{user} #[fg=$TN_DARK2,bg=$TN_BG] #[fg=$TN_BLUE,bg=$TN_BG]#[fg=$TN_BG,bg=$TN_BLUE]  #[fg=$TN_BG,bg=$TN_BLUE]#[fg=$TN_FG,bg=$TN_BG] %H:%M #[fg=$TN_DARK2,bg=$TN_BG]"

setw -g window-status-format " #[fg=$TN_DARK3,bg=default] #I |#[default]#[fg=$TN_FG,bg=default] #W "
setw -g window-status-current-format " #[fg=$TN_ORANGE,bg=default] #I |#[default]#[fg=$TN_ORANGE,bg=default,bold] #W "
setw -g window-status-separator ""

set -g message-style "bg=$TN_DARK2,fg=$TN_FG"
set -g message-command-style "bg=$TN_DARK2,fg=$TN_FG"

set -g pane-border-style "fg=$TN_DARK3,bg=$TN_BG"
set -g pane-active-border-style "fg=$TN_BLUE,bg=$TN_BG"

set -g mode-style "bg=$TN_PURPLE,fg=$TN_BG"
set -g copy-mode-match-style "bg=#2e3b59,fg=$TN_FG"
set -g copy-mode-current-match-style "bg=$TN_ORANGE,fg=$TN_BG"

# Plugins — TPM `run` must be last
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
run "~/.tmux/plugins/tpm/tpm"
